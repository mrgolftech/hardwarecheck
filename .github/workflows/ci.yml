name: Synthetic unit tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Run synthetic regression suite
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: hardwarecheck review --netlist tests/fixtures/pstxnet.dat --parts tests/fixtures/pstxprt.dat --bom tests/fixtures/bom.csv
