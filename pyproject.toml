[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardwarecheck"
version = "0.1.0"
description = "Read-only engineering data adapters and rule checks for hardware design Agent Skills"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.23"]
dev = ["pytest>=8"]

[project.scripts]
hardwarecheck = "hardwarecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
